spring.application.name=sagsa-api

# Configuração de cores no terminal do Spring Boot
spring.output.ansi.enabled=ALWAYS

# Configuração de Conexão com o Banco de Dados (banco criado pelo script sistema_sapz)
# O driver é escolhido automaticamente pela URL:
#   MySQL 8+    -> jdbc:mysql://localhost:3306/sistema_sapz?serverTimezone=America/Sao_Paulo
#   MariaDB 10+ -> jdbc:mariadb://localhost:3306/sistema_sapz
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_sapz?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=123456

# Configuração do Hibernate / JPA
# O banco é criado pelo script SQL oficial, por isso o Hibernate NÃO altera o schema.
# Use "validate" para conferir se as entidades batem com as tabelas existentes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Mensagens de validação (Bean Validation) em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Datas no formato ISO (yyyy-MM-dd / yyyy-MM-ddTHH:mm:ss) no JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

logging.level.org.springframework.web=INFO

# Exibe a stacktrace no JSON de erro (true apenas em desenvolvimento)
server.error.include-exception=false

# Configuração do JWT (Segurança) - troque o segredo em produção (mínimo 64 caracteres)
jwt.secret=SAGSA_SAPZ_1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890
jwt.expiration=86400000

# Origens permitidas no CORS (front-end)
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:5173,http://localhost:3000

# Carga inicial: perfis padrão e administrador criados automaticamente se não existirem
app.seed.enabled=true
app.admin.nome=Administrador SAGSA
app.admin.email=admin@sagsa.com.br
app.admin.senha=Admin@123
